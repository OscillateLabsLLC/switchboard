# Canonical intent schema. Doubles as the Phase 1 schema prototype.
#
# `ovos:` maps real OVOS labels (skill_id:intent) to each canonical intent.
# An entry is either a bare label or {label, slots: {ovos_slot: canonical_slot}}.
# Mappings were pre-filled from .intent files in the skill repos
# (harvest_examples.py). Adapt/.voc-based intents (most Neon alerts, weather,
# user settings, messaging) still need mapping on a live stack: run_ovos.py
# prints the unmapped labels it sees.
#
# Canonical intents may be coarser than OVOS labels (many-to-one is fine).
# risk: low | medium | high. High-risk wrong fires are reported separately.
# Intents with no backing skill (lock.*, cover.*) are capabilities you want
# routed (HA Assist / LLM fallback); they stay as high-risk test targets.

intents:
  alarm.cancel:
    risk: medium
    slots: ["time", "date"]
    description: "Cancel an alarm"
    ovos: []
  alarm.set:
    risk: low
    slots: ["time", "date", "recurrence"]
    description: "Set a wake-up or clock alarm"
    ovos:
      - skill-alerts.neongeckocom:CreateAlarm
      - skill-alerts.neongeckocom:wake_me
      - {label: ovos-skill-alerts.openvoiceos:create_alarm, slots: {"days": "recurrence"}}
  alerts.list:
    risk: low
    slots: []
    description: "List active timers, alarms, and reminders"
    ovos:
      - skill-alerts.neongeckocom:ListAllAlerts
      - skill-alerts.neongeckocom:NextAlert
      - skill-alerts.neongeckocom:list_alerts
      - ovos-skill-alerts.openvoiceos:list_alerts
  app.close:
    risk: medium
    slots: ["app"]
    description: "Quit a desktop application"
    ovos:
      - {label: skill-mac-application-launcher.oscillatelabsllc:close, slots: {"application": "app"}}
  app.launch:
    risk: low
    slots: ["app"]
    description: "Open or switch to a desktop application"
    ovos:
      - {label: skill-mac-application-launcher.oscillatelabsllc:launch, slots: {"application": "app"}}
      # launcher >=0.13 answers via fallback; one label covers open AND close (undercounts app.close)
      - ovos.skills.fallback.ovos-skill-application-launcher.openvoiceos.request
      # Neon launcher opens phone/desktop apps (Mike labelled these app.launch, 2026-10-11)
      - {label: skill-launcher.neongeckocom:launch_program, slots: {"program": "app"}}
